[project]
name = "audio-summarizer"
version = "0.1.0"
description = "Turn an audio recording into a plain-language summary and transcript, fully offline with free open-source models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.1.0",
    # av 19 removed an option faster-whisper still uses; remove this cap once faster-whisper is updated
    "av>=12.0.0,<19",
    "transformers>=5.0.0",
    "torch>=2.4.0",
]

[project.scripts]
summarize = "audio_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_summarizer"]
